[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livetranslate"
version = "0.2.0"
description = "Local system-audio English to Chinese translation prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
live = ["PySide6-Essentials>=6.8,<7", "webrtcvad-wheels>=2.0.14,<3", "psutil>=6,<8"]

[project.scripts]
livetranslate = "livetranslate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["real: requires real local models and explicit opt-in", "audio: requires a live Linux PulseAudio-compatible session"]
