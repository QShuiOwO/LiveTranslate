# Relative paths are resolved against this file's parent (config/).
[audio]
ffmpeg = "ffmpeg"
pactl = "pactl"
duration = 15.0
source = ""
silence_dbfs = -60.0

[asr]
binary = "../build/whisper-vulkan/bin/whisper-cli"
model = "../models/ggml-small.en.bin"
backend = "vulkan"
device = 0
threads = 8
timeout = 180.0

[translation]
base_url = "http://127.0.0.1:8080"
model = "Qwen3-4B-Instruct-2507-Q4_K_M"
timeout = 120.0
max_tokens = 256
seed = 42

[server]
binary = "../build/llama-vulkan/bin/llama-server"
model = "../models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
port = 8080
backend = "vulkan"
device = "Vulkan0"
context_size = 4096
gpu_layers = 99
threads = 8

[output]
directory = "../artifacts"
